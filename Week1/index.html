<!-- Step 1 -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style/styling.css" />
    <!-- Font Awesome CDN for icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <script
      src="https://kit.fontawesome.com/yourcode.js"
      crossorigin="anonymous"
    ></script>
    <title>Halaman Login</title>
  </head>
  <body>
    <div class="login-container">
      <div class="login-icon">👤</div>
      <h1>Selamat Datang</h1>
      <p class="subtitle">SIlahkan Login untuk Melanjutkan</p>

      <!-- Step 2 (Login Form) -->
      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="Masukkan Email Anda"
            required
          />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Masukkan Password anda"
            required
          />
        </div>
        <div class="checkbox-container">
          <div class="checkbox-group">
            <input type="checkbox" id="rememberMe" name="remember" />
            <label for="rememberMe">Ingat Saya</label>
          </div>
          <a href="#" class="forgot-password">Lupa Password</a>
        </div>

        <!-- 3. Button -->
        <button type="submit" class="login-btn" id="LoginBtn">Masuk</button>
      </form>
      <div class="divider"><span>atau masuk dengan</span></div>

      <div class="social-login">
        <button
          class="social-btn google"
          onclick="alert('Login dengan Google')"
        >
          <span><i class="fa-brands fa-google"></i> </span> Google
        </button>
      </div>
      <p class="signup-link">
        Belum punya akun? <a href="#">Daftar Sekarang</a>
      </p>
    </div>
  </body>
</html>
