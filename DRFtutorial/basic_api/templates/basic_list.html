{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Book List</title>
    <style>
        body { font-family: Arial; background: #f8f8f8; margin: 0; padding: 20px; }
        h1 { text-align: center; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border-bottom: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background: #007bff; color: white; }
        a.btn, button { padding: 5px 10px; border-radius: 5px; text-decoration: none; font-size: 0.9em; }
        .btn-edit { background: #ffc107; color: #000; }
        .btn-delete { background: #dc3545; color: #fff; }
        .create-form input, .create-form select { padding: 5px; margin: 5px; }
        .create-form button { background: #007bff; color: white; border: none; padding: 7px 15px; border-radius: 5px; }
    </style>
</head>
<body>
<div class="container">
    <h1>📚 Book List</h1>

    <form class="create-form" method="POST" enctype="multipart/form-data" action="{% url 'post_create' %}">
        {% csrf_token %}
        <input type="text" name="name" placeholder="Name" required>
        <input type="text" name="author" placeholder="Author" required>
        <select name="rating" required>
            <option value="">-- Rating --</option>
            <option value="excellent">Excellent</option>
            <option value="average">Average</option>
            <option value="bad">Bad</option>
        </select>
        <input type="file" name="image" accept="image/*">
        <button type="submit">Add</button>
    </form>

    <table>
        <tr>
            <th>Name</th>
            <th>Author</th>
            <th>Rating</th>
            <th>Image</th>
            <th>Actions</th>
        </tr>
        {% for post in posts %}
        <tr>
            <td>{{ post.name }}</td>
            <td>{{ post.author }}</td>
            <td>{{ post.rating }}</td>
            <td>
                {% if post.image %}
                    <img src="{{ post.image.url }}" width="80">
                {% else %}
                    <span>No image</span>
                {% endif %}
            </td>
            <td>
                <a href="{% url 'post_edit' post.pk %}" class="btn btn-edit">Edit</a>
                <a href="{% url 'post_delete' post.pk %}" class="btn btn-delete" onclick="return confirm('Are you sure?')">Delete</a>
            </td>
        </tr>
        {% endfor %}
    </table>
</div>
</body>
</html>
